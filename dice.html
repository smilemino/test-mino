<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>주사위 게임</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1220;color:#fff;
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .ui{position:fixed;top:0;left:0;right:0;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;z-index:2}
  .title{font-size:.95rem;opacity:.85;letter-spacing:.02em}
  .counter{font-size:.78rem;opacity:.55;font-variant-numeric:tabular-nums}
  .result{position:fixed;bottom:0;left:0;right:0;padding:18px 16px 26px;
    text-align:center;pointer-events:none;z-index:2}
  .sum{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.65)}
  .sum.rolling{opacity:.5;font-weight:500}
  .hint{margin-top:6px;font-size:.78rem;opacity:.55;transition:opacity .25s}
  .hint.hide{opacity:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="ui">
  <div class="title">주사위 게임</div>
  <div class="counter" id="counter">0회</div>
</div>
<div class="result">
  <div class="sum" id="sum">탭해서 굴리기</div>
  <div class="hint" id="hint">화면 어디든 탭/클릭하면 굴러갑니다</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const TAG = '[mino-factory-dice]';
const app = document.getElementById('app');
const sumEl = document.getElementById('sum');
const counterEl = document.getElementById('counter');
const hintEl = document.getElementById('hint');

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a1220');
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 0.95);
dir.position.set(5, 12, 6);
dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
const D = 8;
dir.shadow.camera.left=-D; dir.shadow.camera.right=D;
dir.shadow.camera.top=D; dir.shadow.camera.bottom=-D;
scene.add(dir);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({color:0x142442, roughness:0.95})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const world = new CANNON.World({gravity: new CANNON.Vec3(0, -32, 0)});
world.allowSleep = true;
world.broadphase = new CANNON.SAPBroadphase(world);
const matDice = new CANNON.Material('dice');
const matGround = new CANNON.Material('ground');
world.addContactMaterial(new CANNON.ContactMaterial(matDice, matGround,
  {friction:0.35, restitution:0.28}));
world.addContactMaterial(new CANNON.ContactMaterial(matDice, matDice,
  {friction:0.05, restitution:0.45}));

const ground = new CANNON.Body({mass:0, material:matGround, shape:new CANNON.Plane()});
ground.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
world.addBody(ground);

const walls = [
  {p:[0,5,-6.5], a:[0,1,0], r:0},
  {p:[0,5, 6.5], a:[0,1,0], r:Math.PI},
  {p:[-6.5,5,0], a:[0,1,0], r:Math.PI/2},
  {p:[ 6.5,5,0], a:[0,1,0], r:-Math.PI/2},
];
for (const w of walls){
  const b = new CANNON.Body({mass:0, material:matGround, shape:new CANNON.Plane()});
  b.position.set(w.p[0], w.p[1], w.p[2]);
  b.quaternion.setFromAxisAngle(new CANNON.Vec3(w.a[0], w.a[1], w.a[2]), w.r);
  world.addBody(b);
}

function faceTexture(n){
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f7f2e4';
  ctx.fillRect(0,0,S,S);
  ctx.strokeStyle = '#d6cdb6';
  ctx.lineWidth = 10;
  ctx.strokeRect(5,5,S-10,S-10);
  ctx.fillStyle = (n === 1) ? '#c03030' : '#222';
  const r = S*0.085, m = S/2, a = S*0.28, b = S - a;
  const pip = (x,y) => { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); };
  const map = {
    1:[[m,m]],
    2:[[a,a],[b,b]],
    3:[[a,a],[m,m],[b,b]],
    4:[[a,a],[a,b],[b,a],[b,b]],
    5:[[a,a],[a,b],[m,m],[b,a],[b,b]],
    6:[[a,a],[a,m],[a,b],[b,a],[b,m],[b,b]],
  };
  map[n].forEach(([x,y]) => pip(x,y));
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

const FACE_NUMBERS = [1, 6, 2, 5, 3, 4];
const LOCAL_AXES = [
  new THREE.Vector3( 1, 0, 0),
  new THREE.Vector3(-1, 0, 0),
  new THREE.Vector3( 0, 1, 0),
  new THREE.Vector3( 0,-1, 0),
  new THREE.Vector3( 0, 0, 1),
  new THREE.Vector3( 0, 0,-1),
];

function makeDie(){
  const mats = FACE_NUMBERS.map(n => new THREE.MeshStandardMaterial({
    map: faceTexture(n), roughness:0.45, metalness:0.05
  }));
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mats);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const body = new CANNON.Body({
    mass:1,
    shape:new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)),
    material: matDice,
    allowSleep: true,
    sleepSpeedLimit: 0.12,
    sleepTimeLimit: 0.4,
    linearDamping: 0.05,
    angularDamping: 0.05,
  });
  world.addBody(body);
  return {mesh, body};
}

const dice = [makeDie(), makeDie()];

function topFace(d){
  let bestI = 0, bestY = -Infinity;
  for (let i = 0; i < 6; i++){
    const v = LOCAL_AXES[i].clone().applyQuaternion(d.mesh.quaternion);
    if (v.y > bestY){ bestY = v.y; bestI = i; }
  }
  return FACE_NUMBERS[bestI];
}

let rolling = false;
let stableFrames = 0;
let rollCount = 0;

function roll(){
  const spawn = [
    new CANNON.Vec3(-1.6, 5.5,  0.4),
    new CANNON.Vec3( 1.6, 5.5, -0.4),
  ];
  dice.forEach((d, i) => {
    d.body.wakeUp();
    d.body.position.copy(spawn[i]);
    d.body.velocity.set(
      (Math.random() - 0.5) * 6, 0,
      (Math.random() - 0.5) * 6);
    d.body.angularVelocity.set(
      (Math.random() - 0.5) * 22,
      (Math.random() - 0.5) * 22,
      (Math.random() - 0.5) * 22);
    const q = new CANNON.Quaternion();
    q.setFromEuler(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
    d.body.quaternion.copy(q);
  });
  rolling = true;
  stableFrames = 0;
  sumEl.textContent = '굴리는 중…';
  sumEl.classList.add('rolling');
  hintEl.classList.add('hide');
  rollCount++;
  counterEl.textContent = rollCount + '회';
}

function isSettled(){
  return dice.every(d => {
    if (d.body.sleepState === CANNON.Body.SLEEPING) return true;
    return d.body.velocity.length() < 0.08 && d.body.angularVelocity.length() < 0.08;
  });
}

function resize(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (camera.aspect < 1){
    camera.position.set(0, 12.5, 9);
  } else {
    camera.position.set(0, 10, 8);
  }
  camera.lookAt(0, 0.5, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function handleTap(e){
  const t = e.target;
  if (t && t.closest && t.closest('a,button')) return;
  roll();
}
window.addEventListener('pointerdown', handleTap, {passive:true});

const fixedStep = 1/60;
let last = performance.now();
function tick(now){
  const dt = Math.min(Math.max((now - last)/1000, 1/240), 0.1);
  last = now;
  world.step(fixedStep, dt, 3);
  for (const d of dice){
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
  }
  if (rolling){
    if (isSettled()){
      stableFrames++;
      if (stableFrames > 18){
        const v1 = topFace(dice[0]);
        const v2 = topFace(dice[1]);
        sumEl.textContent = `${v1} + ${v2} = ${v1 + v2}`;
        sumEl.classList.remove('rolling');
        rolling = false;
        console.log(TAG, 'result', v1, v2);
      }
    } else {
      stableFrames = 0;
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

dice[0].body.position.set(-1.4, 0.5,  0.5);
dice[1].body.position.set( 1.4, 0.5, -0.5);
dice.forEach(d => d.body.sleep());
requestAnimationFrame(tick);
console.log(TAG, 'ready');
</script>
</body>
</html>
