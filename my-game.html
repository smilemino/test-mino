<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가위바위보</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }
    h1 { font-size: 2rem; letter-spacing: 2px; color: #e94560; }
    .score-board {
      display: flex;
      gap: 32px;
      font-size: 1.1rem;
    }
    .score-item { text-align: center; }
    .score-item span {
      display: block;
      font-size: 2rem;
      font-weight: bold;
      color: #0f3460;
      background: #e94560;
      border-radius: 8px;
      padding: 4px 20px;
      margin-top: 4px;
    }
    .battle {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 4rem;
      min-height: 80px;
    }
    .vs { font-size: 1.4rem; color: #aaa; }
    .result-msg {
      font-size: 1.5rem;
      font-weight: bold;
      min-height: 2rem;
      color: #ffd700;
    }
    .buttons { display: flex; gap: 16px; }
    .btn {
      font-size: 2rem;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      background: #16213e;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn small { font-size: 0.75rem; color: #aaa; }
    .btn:hover { background: #0f3460; transform: scale(1.08); }
    .btn:active { transform: scale(0.95); }
    .reset-btn {
      font-size: 0.9rem;
      padding: 8px 20px;
      border: 1px solid #555;
      border-radius: 8px;
      background: transparent;
      color: #aaa;
      cursor: pointer;
    }
    .reset-btn:hover { background: #333; color: #fff; }
  </style>
</head>
<body>
  <h1>가위바위보</h1>

  <div class="score-board">
    <div class="score-item">승<span id="win">0</span></div>
    <div class="score-item">무<span id="draw">0</span></div>
    <div class="score-item">패<span id="lose">0</span></div>
  </div>

  <div class="battle">
    <span id="player-icon">🤔</span>
    <span class="vs">VS</span>
    <span id="computer-icon">🤔</span>
  </div>

  <div class="result-msg" id="result-msg">선택하세요!</div>

  <div class="buttons">
    <button class="btn" onclick="play('scissors')">✌️<small>가위</small></button>
    <button class="btn" onclick="play('rock')">✊<small>바위</small></button>
    <button class="btn" onclick="play('paper')">🖐️<small>보</small></button>
  </div>

  <button class="reset-btn" onclick="resetScore()">점수 초기화</button>

  <script>
    const CHOICES = {
      scissors: { icon: '✌️', beats: 'paper' },
      rock:     { icon: '✊', beats: 'scissors' },
      paper:    { icon: '🖐️', beats: 'rock' },
    };
    const KEYS = Object.keys(CHOICES);
    let score = { win: 0, draw: 0, lose: 0 };

    function play(playerChoice) {
      const compChoice = KEYS[Math.floor(Math.random() * 3)];
      document.getElementById('player-icon').textContent = CHOICES[playerChoice].icon;
      document.getElementById('computer-icon').textContent = CHOICES[compChoice].icon;

      let msg, key;
      if (playerChoice === compChoice) {
        msg = '무승부! 🤝'; key = 'draw';
      } else if (CHOICES[playerChoice].beats === compChoice) {
        msg = '승리! 🎉'; key = 'win';
      } else {
        msg = '패배... 😢'; key = 'lose';
      }

      score[key]++;
      document.getElementById('result-msg').textContent = msg;
      document.getElementById('win').textContent  = score.win;
      document.getElementById('draw').textContent = score.draw;
      document.getElementById('lose').textContent = score.lose;
    }

    function resetScore() {
      score = { win: 0, draw: 0, lose: 0 };
      ['win','draw','lose'].forEach(k => document.getElementById(k).textContent = 0);
      document.getElementById('player-icon').textContent = '🤔';
      document.getElementById('computer-icon').textContent = '🤔';
      document.getElementById('result-msg').textContent = '선택하세요!';
    }

    document.addEventListener('keydown', e => {
      if (e.key === '1') play('scissors');
      else if (e.key === '2') play('rock');
      else if (e.key === '3') play('paper');
      else if (e.key === 'r' || e.key === 'R') resetScore();
    });
  </script>
</body>
</html>
