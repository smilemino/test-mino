<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>test-mino · 테스트</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #1f2937 0%, #0b1220 60%, #05070d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #e5e7eb;
    padding: 24px;
  }
  .card {
    background: rgba(17, 24, 39, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 36px 40px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    max-width: 420px;
    width: 100%;
  }
  h1 { font-size: 1.6rem; margin-bottom: 10px; letter-spacing: -0.02em; }
  p { color: #9ca3af; line-height: 1.6; font-size: 0.95rem; }
  .badge {
    display: inline-block;
    margin-top: 18px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #10b981;
    color: #052e1f;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .time { margin-top: 14px; font-size: 0.85rem; color: #6b7280; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <h1>테스트 페이지</h1>
    <p>mino-factory 흐름이 정상 작동했습니다.<br/>이 페이지는 spec.md의 테스트 사양에 따라 생성되었습니다.</p>
    <div class="badge">OK</div>
    <div class="time" id="time"></div>
    <div class="time">세션: 2026-05-16 01:06 (Asia/Seoul)</div>
  </div>
  <script>
    const el = document.getElementById("time");
    const pad = (n) => String(n).padStart(2, "0");
    const tick = () => {
      const d = new Date();
      el.textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    };
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
