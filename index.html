<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숫자 카운터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      min-width: 280px;
    }

    .label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .count {
      font-size: 6rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      margin-bottom: 40px;
      transition: transform 0.1s ease;
      min-width: 180px;
      display: inline-block;
    }

    .count.bump {
      transform: scale(1.12);
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-minus {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-minus:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .btn-plus {
      background: #fff;
      color: #764ba2;
    }

    .btn-plus:hover {
      background: #f0eaff;
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    button:active { transform: scale(0.96); }

    .nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      padding: 6px 12px;
      z-index: 100;
    }

    .nav a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }

    .nav a:hover, .nav a.on {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="on">카운터</a>
    <a href="clock.html">시계</a>
    <a href="todo.html">할 일</a>
    <a href="rps.html">가위바위보</a>
  </nav>
  <div class="card">
    <div class="label">Counter</div>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button class="btn-minus" onclick="change(-1)" aria-label="빼기">−</button>
      <button class="btn-plus" onclick="change(1)" aria-label="더하기">＋</button>
    </div>
  </div>

  <script>
    let n = 0;
    const el = document.getElementById('count');

    function change(delta) {
      n += delta;
      el.textContent = n;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  </script>
</body>
</html>
