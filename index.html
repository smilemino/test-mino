<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>메모장</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%;background:#0a1220;color:#fff;
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif}
  body{display:flex;justify-content:center;padding:1rem;min-height:100dvh}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:.9rem}
  h1{font-size:1.05rem;font-weight:600;letter-spacing:.02em;opacity:.85;text-align:center;padding:.4rem 0}
  .card{background:#121d33;border:1px solid #1f2c47;border-radius:18px;padding:1rem;box-shadow:0 16px 40px rgba(0,0,0,.4)}
  textarea{
    width:100%;min-height:110px;resize:vertical;background:#0e1729;color:#fff;
    border:1px solid #1f2c47;border-radius:12px;padding:.75rem .85rem;
    font:inherit;font-size:.95rem;line-height:1.45;outline:none;
  }
  textarea:focus{border-color:#3a5396}
  .row{display:flex;gap:.5rem;margin-top:.65rem;align-items:center}
  .count{font-size:.78rem;opacity:.55;margin-right:auto}
  button{
    background:#1b2848;border:1px solid #2a3a63;color:#fff;border-radius:12px;
    padding:.6rem 1rem;font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;
    transition:transform .08s, background .15s;
  }
  button:hover{background:#23335a}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .add{background:#2a4a8a;border-color:#3a5fae}
  .add:hover{background:#335aa6}
  .list{display:flex;flex-direction:column;gap:.55rem}
  .empty{text-align:center;opacity:.5;font-size:.9rem;padding:1.4rem .5rem}
  .item{
    background:#121d33;border:1px solid #1f2c47;border-radius:14px;
    padding:.8rem .9rem;display:flex;gap:.6rem;align-items:flex-start;
  }
  .item .body{flex:1;min-width:0}
  .item .text{font-size:.95rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .item .time{font-size:.72rem;opacity:.45;margin-top:.35rem}
  .del{
    background:transparent;border:1px solid #3a2a2a;color:#ff9a9a;
    padding:.4rem .65rem;font-size:.8rem;border-radius:10px;
  }
  .del:hover{background:#3a1f1f;color:#fff;border-color:#5a2a2a}
</style>
</head>
<body>
  <main class="wrap" role="main">
    <h1>메모장</h1>
    <section class="card">
      <textarea id="input" placeholder="메모를 입력하세요..." maxlength="2000" aria-label="새 메모"></textarea>
      <div class="row">
        <span class="count" id="count">0 / 2000</span>
        <button class="add" id="add" type="button">추가</button>
      </div>
    </section>
    <section class="list" id="list" aria-live="polite"></section>
  </main>
<script>
  const KEY = 'test-mino:notes:v1';
  const $ = (id) => document.getElementById(id);
  const input = $('input'), list = $('list'), addBtn = $('add'), count = $('count');

  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  };
  const save = (notes) => localStorage.setItem(KEY, JSON.stringify(notes));

  const fmt = (ts) => {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  function render(){
    const notes = load();
    list.innerHTML = '';
    if(notes.length === 0){
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = '아직 메모가 없어요. 위에서 첫 메모를 작성하세요.';
      list.appendChild(e); return;
    }
    notes.slice().sort((a,b)=>b.ts-a.ts).forEach(n => {
      const item = document.createElement('div'); item.className = 'item';
      const body = document.createElement('div'); body.className = 'body';
      const t = document.createElement('div'); t.className = 'text'; t.textContent = n.text;
      const tm = document.createElement('div'); tm.className = 'time'; tm.textContent = fmt(n.ts);
      body.appendChild(t); body.appendChild(tm);
      const del = document.createElement('button'); del.className = 'del'; del.type='button'; del.textContent = '삭제';
      del.addEventListener('click', () => {
        if(!confirm('이 메모를 삭제할까요?')) return;
        save(load().filter(x => x.id !== n.id));
        render();
      });
      item.appendChild(body); item.appendChild(del);
      list.appendChild(item);
    });
  }

  function updateCount(){
    const len = input.value.length;
    count.textContent = `${len} / 2000`;
    addBtn.disabled = input.value.trim().length === 0;
  }

  function add(){
    const text = input.value.trim();
    if(!text) return;
    const notes = load();
    notes.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,8), text, ts: Date.now() });
    save(notes);
    input.value = '';
    updateCount();
    render();
    input.focus();
  }

  addBtn.addEventListener('click', add);
  input.addEventListener('input', updateCount);
  input.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); add(); }
  });

  updateCount();
  render();
</script>
</body>
</html>
