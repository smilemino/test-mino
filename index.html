<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가위바위보</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 16px 32px;
    }

    .nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      padding: 6px 12px;
      z-index: 100;
    }

    .nav a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }

    .nav a:hover, .nav a.on {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
    }

    h1 {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      margin-bottom: 28px;
    }

    .score-box {
      flex: 1;
      padding: 12px 8px;
    }

    .score-label {
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .score-num {
      color: #fff;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
    }

    .divider {
      width: 1px;
      background: rgba(255, 255, 255, 0.25);
      margin: 8px 0;
    }

    .arena {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 20px;
      min-height: 90px;
    }

    .choice-display {
      font-size: 3.5rem;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .choice-display.pop {
      animation: pop 0.25s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    .vs {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .result {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 1.8rem;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    .result.win   { color: #ffe566; }
    .result.lose  { color: rgba(255,255,255,0.55); }
    .result.draw  { color: #b8f0ff; }

    .choices {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .btn-choice {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.18);
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-choice:hover {
      background: rgba(255,255,255,0.32);
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }

    .btn-choice:active { transform: scale(0.95); }

    .btn-reset {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.85);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.18s, color 0.18s;
    }

    .btn-reset:hover {
      background: rgba(255,255,255,0.32);
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="on">가위바위보</a>
    <a href="clock.html">시계</a>
    <a href="todo.html">할 일</a>
  </nav>

  <div class="card">
    <h1>가위바위보</h1>

    <div class="scoreboard">
      <div class="score-box">
        <div class="score-label">나</div>
        <div class="score-num" id="scoreUser">0</div>
      </div>
      <div class="divider"></div>
      <div class="score-box">
        <div class="score-label">무승부</div>
        <div class="score-num" id="scoreDraw">0</div>
      </div>
      <div class="divider"></div>
      <div class="score-box">
        <div class="score-label">컴퓨터</div>
        <div class="score-num" id="scoreComp">0</div>
      </div>
    </div>

    <div class="arena">
      <div class="choice-display" id="userChoice">✊</div>
      <div class="vs">VS</div>
      <div class="choice-display" id="compChoice">✊</div>
    </div>

    <div class="result" id="result">선택하세요</div>

    <div class="choices">
      <button class="btn-choice" onclick="play('rock')"    aria-label="바위">✊</button>
      <button class="btn-choice" onclick="play('scissors')" aria-label="가위">✌️</button>
      <button class="btn-choice" onclick="play('paper')"   aria-label="보">🖐️</button>
    </div>

    <button class="btn-reset" onclick="resetAll()">점수 초기화</button>
  </div>

  <script>
    const EMOJI = { rock: '✊', scissors: '✌️', paper: '🖐️' };
    const CHOICES = ['rock', 'scissors', 'paper'];
    let score = { user: 0, comp: 0, draw: 0 };

    function play(userPick) {
      const compPick = CHOICES[Math.floor(Math.random() * 3)];
      const outcome = judge(userPick, compPick);

      setDisplay('userChoice', EMOJI[userPick]);
      setDisplay('compChoice', EMOJI[compPick]);

      if (outcome === 'win')       { score.user++; showResult('win', '이겼습니다! 🎉'); }
      else if (outcome === 'lose') { score.comp++; showResult('lose', '졌습니다 😢'); }
      else                         { score.draw++; showResult('draw', '비겼습니다 🤝'); }

      document.getElementById('scoreUser').textContent = score.user;
      document.getElementById('scoreComp').textContent = score.comp;
      document.getElementById('scoreDraw').textContent = score.draw;
    }

    function judge(u, c) {
      if (u === c) return 'draw';
      if ((u === 'rock' && c === 'scissors') ||
          (u === 'scissors' && c === 'paper') ||
          (u === 'paper' && c === 'rock')) return 'win';
      return 'lose';
    }

    function showResult(cls, msg) {
      const el = document.getElementById('result');
      el.className = 'result ' + cls;
      el.textContent = msg;
    }

    function setDisplay(id, emoji) {
      const el = document.getElementById(id);
      el.textContent = emoji;
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }

    function resetAll() {
      score = { user: 0, comp: 0, draw: 0 };
      document.getElementById('scoreUser').textContent = 0;
      document.getElementById('scoreComp').textContent = 0;
      document.getElementById('scoreDraw').textContent = 0;
      document.getElementById('userChoice').textContent = '✊';
      document.getElementById('compChoice').textContent = '✊';
      const el = document.getElementById('result');
      el.className = 'result';
      el.textContent = '선택하세요';
    }
  </script>
</body>
</html>
