<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>가위바위보</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%;background:#0a1220;color:#fff;
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;
    user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center;padding:1rem;min-height:100dvh}
  .card{
    width:100%;max-width:420px;background:#121d33;border:1px solid #1f2c47;border-radius:20px;
    padding:1.4rem 1.2rem 1.2rem;box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  h1{font-size:1.05rem;font-weight:600;letter-spacing:.02em;opacity:.85;text-align:center;margin-bottom:.9rem}
  .score{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
  .score div{background:#0e1729;border:1px solid #1f2c47;border-radius:12px;padding:.55rem .3rem;text-align:center}
  .score .lbl{font-size:.72rem;opacity:.6;margin-bottom:.2rem}
  .score .val{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
  .arena{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.8rem}
  .hand{background:#0e1729;border:1px solid #1f2c47;border-radius:16px;padding:1rem .4rem;text-align:center}
  .hand .who{font-size:.78rem;opacity:.55;margin-bottom:.4rem}
  .hand .emoji{font-size:clamp(3.6rem,16vw,5rem);line-height:1;display:inline-block;transform-origin:50% 70%}
  .hand .emoji.shake{animation:shake .14s linear 0s 4}
  @keyframes shake{
    0%{transform:rotate(-22deg) translateY(0)}
    50%{transform:rotate(18deg) translateY(-6px)}
    100%{transform:rotate(-22deg) translateY(0)}
  }
  .msg{text-align:center;min-height:1.6rem;font-size:1rem;font-weight:600;margin:.2rem 0 .9rem;letter-spacing:-.01em}
  .msg.win{color:#7cf3a0}.msg.lose{color:#ff8a8a}.msg.draw{color:#ffd479}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.55rem}
  .actions button{
    background:#1b2848;border:1px solid #2a3a63;color:#fff;border-radius:14px;
    padding:.85rem .3rem;font-size:1rem;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:.25rem;transition:transform .08s, background .15s;
  }
  .actions button .e{font-size:1.7rem;line-height:1}
  .actions button:hover{background:#23335a}
  .actions button:active{transform:scale(.96)}
  .actions button:disabled{opacity:.45;cursor:not-allowed}
  .reset{
    width:100%;background:transparent;border:1px solid #2a3a63;color:#aab4cc;
    border-radius:12px;padding:.6rem;font-size:.85rem;cursor:pointer;
  }
  .reset:hover{background:#162041;color:#fff}
</style>
</head>
<body>
  <main class="card" role="main">
    <h1>가위바위보</h1>
    <section class="score" aria-label="점수판">
      <div><div class="lbl">민호님 승</div><div class="val" id="sU">0</div></div>
      <div><div class="lbl">컴퓨터 승</div><div class="val" id="sC">0</div></div>
      <div><div class="lbl">비김</div><div class="val" id="sD">0</div></div>
    </section>
    <section class="arena">
      <div class="hand"><div class="who">민호님</div><div class="emoji" id="hU">✊</div></div>
      <div class="hand"><div class="who">컴퓨터</div><div class="emoji" id="hC">✊</div></div>
    </section>
    <div class="msg" id="msg">가위·바위·보 중 하나를 누르세요</div>
    <section class="actions">
      <button data-pick="rock"    aria-label="바위"><span class="e">✊</span><span>바위</span></button>
      <button data-pick="paper"   aria-label="보"><span class="e">✋</span><span>보</span></button>
      <button data-pick="scissors" aria-label="가위"><span class="e">✌️</span><span>가위</span></button>
    </section>
    <button class="reset" id="reset">점수 초기화</button>
  </main>
<script>
  const EMOJI = { rock:'✊', paper:'✋', scissors:'✌️' };
  const NAME  = { rock:'바위', paper:'보', scissors:'가위' };
  const BEATS = { rock:'scissors', paper:'rock', scissors:'paper' };
  const PICKS = ['rock','paper','scissors'];
  const score = { u:0, c:0, d:0 };
  let busy = false;

  const $ = (id) => document.getElementById(id);
  const hU = $('hU'), hC = $('hC'), msg = $('msg');
  const sU = $('sU'), sC = $('sC'), sD = $('sD');
  const buttons = document.querySelectorAll('.actions button');

  function setBusy(b){
    busy = b;
    buttons.forEach(btn => btn.disabled = b);
  }
  function paintScore(){ sU.textContent = score.u; sC.textContent = score.c; sD.textContent = score.d; }
  function judge(user, comp){
    if(user === comp) return 'draw';
    return BEATS[user] === comp ? 'win' : 'lose';
  }
  function play(user){
    if(busy) return;
    setBusy(true);
    msg.textContent = '컴퓨터가 고르는 중...';
    msg.className = 'msg';
    hU.textContent = EMOJI[user];
    hC.textContent = '✊';
    hC.classList.remove('shake');
    void hC.offsetWidth;
    hC.classList.add('shake');
    setTimeout(() => {
      const comp = PICKS[Math.floor(Math.random()*3)];
      hC.classList.remove('shake');
      hC.textContent = EMOJI[comp];
      const r = judge(user, comp);
      if(r === 'win'){ score.u++; msg.textContent = `민호님 승리! (${NAME[user]} vs ${NAME[comp]})`; msg.className='msg win'; }
      else if(r === 'lose'){ score.c++; msg.textContent = `컴퓨터 승리! (${NAME[user]} vs ${NAME[comp]})`; msg.className='msg lose'; }
      else { score.d++; msg.textContent = `비겼어요 (${NAME[user]} vs ${NAME[comp]})`; msg.className='msg draw'; }
      paintScore();
      setBusy(false);
    }, 500);
  }

  buttons.forEach(btn => btn.addEventListener('click', () => play(btn.dataset.pick)));
  $('reset').addEventListener('click', () => {
    if(busy) return;
    score.u = score.c = score.d = 0;
    paintScore();
    hU.textContent = '✊'; hC.textContent = '✊';
    msg.textContent = '점수를 초기화했어요'; msg.className = 'msg';
  });
</script>
</body>
</html>
