<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주사위 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>주사위 게임</h1>
    <p class="hint">스페이스바 또는 버튼으로 굴리기 · R 초기화</p>

    <div class="dice" id="dice">⚀</div>
    <div class="result" id="result">굴려보세요</div>

    <div class="scoreboard">
      <div class="score-box">
        <div class="score-label">굴린 횟수</div>
        <div class="score-num" id="rolls">0</div>
      </div>
      <div class="divider"></div>
      <div class="score-box">
        <div class="score-label">합계</div>
        <div class="score-num" id="sum">0</div>
      </div>
      <div class="divider"></div>
      <div class="score-box">
        <div class="score-label">최고 기록</div>
        <div class="score-num" id="best">0</div>
      </div>
    </div>

    <button class="btn-roll" onclick="roll()" id="rollBtn">굴리기 🎲</button>
    <button class="btn-reset" onclick="resetAll()">초기화 [R]</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
