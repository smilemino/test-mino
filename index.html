<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>술자리 주사위</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;cursor:pointer;touch-action:manipulation}
.hint{position:fixed;top:18px;left:0;right:0;text-align:center;
  font-size:0.95rem;letter-spacing:0.08em;opacity:0.78;font-weight:600;
  text-shadow:0 2px 8px rgba(0,0,0,0.25);transition:opacity 0.4s}
.hint.dim{opacity:0.28}
.dice-row{display:flex;gap:28px;align-items:center;justify-content:center;
  margin-bottom:34px;min-height:160px;perspective:800px}
.dice{font-size:8.4rem;line-height:1;display:inline-block;
  text-shadow:0 10px 28px rgba(0,0,0,0.35);
  will-change:transform;transform-origin:50% 50%}
.dice.rolling{animation:tumble 0.42s cubic-bezier(.6,.05,.35,1) infinite}
.dice.rolling.d2{animation-duration:0.36s;animation-direction:reverse}
.dice.settle{animation:settle 0.5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes tumble{
  0%{transform:translateY(0) rotate(0deg) scale(1)}
  25%{transform:translateY(-46px) rotate(180deg) scale(1.08)}
  50%{transform:translateY(0) rotate(360deg) scale(0.94)}
  75%{transform:translateY(-22px) rotate(540deg) scale(1.04)}
  100%{transform:translateY(0) rotate(720deg) scale(1)}}
@keyframes settle{
  0%{transform:translateY(-30px) rotate(40deg) scale(1.3)}
  55%{transform:translateY(8px) rotate(-8deg) scale(0.92)}
  80%{transform:translateY(-3px) rotate(3deg) scale(1.04)}
  100%{transform:translateY(0) rotate(0deg) scale(1)}}
.sum-box{text-align:center;opacity:0;transition:opacity 0.3s}
.sum-box.show{opacity:1}
.sum-label{font-size:0.78rem;letter-spacing:0.22em;opacity:0.75;margin-bottom:4px}
.sum-num{font-size:4.6rem;font-weight:900;line-height:1;
  text-shadow:0 6px 20px rgba(0,0,0,0.35)}
@media (max-width:380px){
  .dice{font-size:6.6rem}
  .sum-num{font-size:3.8rem}
  .dice-row{gap:18px;min-height:130px}
}
</style>
</head>
<body id="stage">
<div class="hint" id="hint">화면 아무 곳이나 탭</div>
<div class="dice-row" id="diceRow">
  <span class="dice" id="d1">⚀</span>
  <span class="dice" id="d2">⚀</span>
</div>
<div class="sum-box" id="sumBox">
  <div class="sum-label">합계</div>
  <div class="sum-num" id="sumNum">—</div>
</div>
<script>
const FACES=['⚀','⚁','⚂','⚃','⚄','⚅'];
const d1=document.getElementById('d1'),d2=document.getElementById('d2');
const sumNum=document.getElementById('sumNum'),sumBox=document.getElementById('sumBox');
const hint=document.getElementById('hint');
let rolling=false;
function rand(){return Math.floor(Math.random()*6)+1}
function setFace(el,v){el.textContent=FACES[v-1]}
function roll(){
  if(rolling)return;rolling=true;
  hint.classList.add('dim');sumBox.classList.remove('show');
  d1.classList.remove('settle');d2.classList.remove('settle');
  d1.classList.add('rolling');d2.classList.add('rolling','d2');
  const spin=setInterval(()=>{setFace(d1,rand());setFace(d2,rand())},80);
  const dur=1100+Math.random()*300;
  setTimeout(()=>{
    clearInterval(spin);
    const v1=rand(),v2=rand();
    setFace(d1,v1);setFace(d2,v2);
    d1.classList.remove('rolling');d2.classList.remove('rolling','d2');
    d1.classList.add('settle');d2.classList.add('settle');
    sumNum.textContent=v1+v2;
    sumBox.classList.add('show');
    rolling=false;
    setTimeout(()=>hint.classList.remove('dim'),400);
  },dur);
}
document.getElementById('stage').addEventListener('click',roll);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();roll();}
});
</script>
</body>
</html>
