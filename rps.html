<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가위바위보</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 16px 32px;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 40px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
    }

    .title {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .score-box {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px 20px;
      min-width: 80px;
    }

    .score-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .score-num {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .vs-text {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .arena {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
      min-height: 100px;
    }

    .choice-display {
      font-size: 3.5rem;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .choice-display.pop {
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.6); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .arena-vs {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .result-msg {
      min-height: 32px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .result-msg.win  { color: #a8edaa; }
    .result-msg.lose { color: #f8a4a4; }
    .result-msg.draw { color: rgba(255,255,255,0.75); }

    .choices {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .btn-choice {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.18);
      font-size: 2.2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s, border-color 0.2s;
    }

    .btn-choice:hover {
      background: rgba(255, 255, 255, 0.32);
      border-color: rgba(255, 255, 255, 0.65);
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-choice:active { transform: scale(0.95); }

    .btn-reset {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.82rem;
      padding: 6px 18px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      padding: 6px 12px;
      z-index: 100;
    }

    .nav a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }

    .nav a:hover, .nav a.on {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">카운터</a>
    <a href="clock.html">시계</a>
    <a href="todo.html">할 일</a>
    <a href="rps.html" class="on">가위바위보</a>
  </nav>

  <div class="card">
    <div class="title">가위바위보</div>

    <div class="scoreboard">
      <div class="score-box">
        <div class="score-label">나</div>
        <div class="score-num" id="myScore">0</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="score-box">
        <div class="score-label">컴퓨터</div>
        <div class="score-num" id="cpuScore">0</div>
      </div>
    </div>

    <div class="arena">
      <div class="choice-display" id="myChoice">❓</div>
      <div class="arena-vs">VS</div>
      <div class="choice-display" id="cpuChoice">❓</div>
    </div>

    <div class="result-msg" id="resultMsg">선택하세요!</div>

    <div class="choices">
      <button class="btn-choice" onclick="play('rock')"    title="바위">✊</button>
      <button class="btn-choice" onclick="play('scissors')" title="가위">✌️</button>
      <button class="btn-choice" onclick="play('paper')"   title="보">✋</button>
    </div>

    <button class="btn-reset" onclick="reset()">다시하기</button>
    <button class="btn-reset" onclick="resetScore()" style="margin-top:6px;opacity:0.6;font-size:0.76rem;">점수 초기화</button>
  </div>

  <script>
    const EMOJI = { rock: '✊', scissors: '✌️', paper: '✋' };
    const LABEL = { rock: '바위', scissors: '가위', paper: '보' };
    const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
    const CHOICES = ['rock', 'scissors', 'paper'];
    let myScore = 0, cpuScore = 0;

    function play(myPick) {
      const cpuPick = CHOICES[Math.floor(Math.random() * 3)];

      const myEl  = document.getElementById('myChoice');
      const cpuEl = document.getElementById('cpuChoice');
      const msg   = document.getElementById('resultMsg');

      myEl.textContent  = EMOJI[myPick];
      cpuEl.textContent = EMOJI[cpuPick];

      [myEl, cpuEl].forEach(el => {
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      });

      let result, cls;
      if (myPick === cpuPick) {
        result = '무승부! 🤝'; cls = 'draw';
      } else if (BEATS[myPick] === cpuPick) {
        result = `${LABEL[myPick]}으로 승리! 🎉`; cls = 'win';
        myScore++;
      } else {
        result = `${LABEL[cpuPick]}에 패배… 😅`; cls = 'lose';
        cpuScore++;
      }

      msg.textContent = result;
      msg.className = 'result-msg ' + cls;
      document.getElementById('myScore').textContent  = myScore;
      document.getElementById('cpuScore').textContent = cpuScore;
    }

    function reset() {
      document.getElementById('myChoice').textContent  = '❓';
      document.getElementById('cpuChoice').textContent = '❓';
      const msg = document.getElementById('resultMsg');
      msg.textContent = '선택하세요!';
      msg.className = 'result-msg';
    }

    function resetScore() {
      myScore = 0; cpuScore = 0;
      document.getElementById('myScore').textContent  = 0;
      document.getElementById('cpuScore').textContent = 0;
      reset();
    }
  </script>
</body>
</html>
